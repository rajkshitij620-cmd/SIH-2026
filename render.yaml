services:
  - type: web
    name: tourmitra-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGIN_REGEX
        value: "^https?://(localhost|127\\.0\\.0\\.1)(:\\d+)?$|^https://.*\\.vercel\\.app$"
