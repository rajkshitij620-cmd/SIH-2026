<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tourmitra - Smart AI Travel Planning</title>
  </head>
  <body>
    <div id="google_translate_element" style="display:none; visibility:hidden;"></div>
    <div id="root"></div>
    <script type="text/javascript">
      // Sync saved language cookie on startup
      (function() {
        var langCode = localStorage.getItem('tourmitra_lang_code');
        if (langCode && langCode !== 'en') {
          var date = new Date();
          date.setTime(date.getTime() + (365*24*60*60*1000));
          var expires = "; expires=" + date.toUTCString();
          document.cookie = "googtrans=/en/" + langCode + expires + "; path=/;";
        }
      })();
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
